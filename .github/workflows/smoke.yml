name: ASIC platform generic netlist smoke
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generic-netlist-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install RTL tools (required)
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Verify actual synthesized generic netlist
        run: bash scripts/generic_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asic-generic-netlist-only
          path: build/
